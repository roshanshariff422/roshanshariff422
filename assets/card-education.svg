<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 290" role="img" aria-label="Education - The Oxford College of Engineering VTU, CGPA 8.65/10, Expected Graduation 2027">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="statGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#230D19"/>
    </linearGradient>
  </defs>

  <rect width="580" height="290" rx="18" fill="url(#eduBg)" stroke="#451126" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="28" y="22" width="152" height="24" rx="12" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="104" y="38" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#E5B5C7">01 // EDUCATION</text>

  <!-- University Name -->
  <text x="28" y="76" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#F8F0F3">The Oxford College of Engineering</text>
  <text x="28" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.5" fill="#C77B9B">Visvesvaraya Technological University (VTU)</text>

  <!-- Degree Panel -->
  <rect x="28" y="122" width="524" height="72" rx="12" fill="#10070C" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.1"/>
  <text x="46" y="150" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" letter-spacing="1.4" fill="#C77B9B">DEGREE PROGRAM</text>
  <text x="46" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#F8F0F3">B.E. in Information Science &amp; Engineering</text>

  <!-- Bottom Dual Metric Boxes -->
  <rect x="28" y="210" width="254" height="58" rx="12" fill="url(#statGlow)" stroke="#701A3D" stroke-width="1.1"/>
  <text x="46" y="232" font-family="Consolas, 'Fira Code', monospace" font-size="11" letter-spacing="1.2" fill="#E5B5C7">EXPECTED GRADUATION</text>
  <text x="46" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#F8F0F3">2027</text>

  <rect x="298" y="210" width="254" height="58" rx="12" fill="url(#statGlow)" stroke="#701A3D" stroke-width="1.1"/>
  <text x="316" y="232" font-family="Consolas, 'Fira Code', monospace" font-size="11" letter-spacing="1.2" fill="#E5B5C7">ACADEMIC CGPA</text>
  <text x="316" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#E5B5C7">8.65 <tspan font-size="14" font-weight="600" fill="#C77B9B">/ 10</tspan></text>
</svg>
