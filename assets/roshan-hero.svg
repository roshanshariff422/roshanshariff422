<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#10070C"/>
  <stop offset="50%" stop-color="#451126"/>
  <stop offset="100%" stop-color="#190B12"/>
</linearGradient>

<linearGradient id="glow">
  <stop offset="0%" stop-color="#701A3D"/>
  <stop offset="50%" stop-color="#E5B5C7"/>
  <stop offset="100%" stop-color="#701A3D"/>
</linearGradient>

<pattern id="grid" width="40" height="40"
         patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40"
        stroke="#C77B9B"
        stroke-opacity=".13"
        fill="none"/>
</pattern>

<filter id="blur">
  <feGaussianBlur stdDeviation="12"/>
</filter>

</defs>

<rect width="1200" height="360" rx="20" fill="url(#bg)"/>

<rect width="1200" height="360" rx="20" fill="url(#grid)"/>

<circle cx="980" cy="180" r="120"
        stroke="#C77B9B" stroke-opacity=".3"
        fill="none">

  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 980 180"
    to="360 980 180"
    dur="20s"
    repeatCount="indefinite"/>

</circle>

<circle cx="980" cy="180" r="170"
        stroke="#E5B5C7"
        stroke-opacity=".2"
        stroke-dasharray="5 12"
        fill="none">

  <animateTransform
    attributeName="transform"
    type="rotate"
    from="360 980 180"
    to="0 980 180"
    dur="30s"
    repeatCount="indefinite"/>

</circle>

<circle cx="980" cy="60" r="6"
        fill="#E5B5C7">

  <animate attributeName="opacity"
           values=".2;1;.2"
           dur="2s"
           repeatCount="indefinite"/>

</circle>

<text x="75" y="125"
      font-family="Arial,sans-serif"
      font-size="55"
      font-weight="bold"
      fill="#F8F0F3">

MOHAMMED ROSHAN

</text>

<text x="75" y="190"
      font-family="Arial,sans-serif"
      font-size="55"
      font-weight="bold"
      fill="#E5B5C7">

SHARIEFF

</text>

<rect x="78" y="215" width="350" height="3"
      rx="2" fill="url(#glow)">

  <animate attributeName="width"
           values="100;350;100"
           dur="4s"
           repeatCount="indefinite"/>

</rect>

<text x="78" y="265"
      font-family="Arial,sans-serif"
      font-size="21"
      letter-spacing="4"
      fill="#F8F0F3">

FULL-STACK DEVELOPER

</text>

<text x="78" y="305"
      font-family="Arial,sans-serif"
      font-size="14"
      letter-spacing="3"
      fill="#C77B9B">

AI / ML • COMPUTER VISION • SOFTWARE

</text>

</svg>
