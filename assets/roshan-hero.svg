<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Mohammed Roshan Sharieff - Full-Stack Developer">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="52%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#701A3D" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C77B9B" stroke-opacity="0.10" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- Base Container -->
  <rect width="1200" height="380" rx="24" fill="url(#heroBg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#heroGrid)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="965" cy="190" r="230" fill="url(#orbGlow)"/>

  <!-- Corner Brackets -->
  <path d="M24 44 V24 H44" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M1156 24 H1176 V44" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M24 336 V356 H44" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M1156 356 H1176 V336" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Top Status Pill -->
  <rect x="72" y="42" width="318" height="32" rx="16" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
  <circle cx="92" cy="58" r="4.5" fill="#E5B5C7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="62.5" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#E5B5C7">
    B.E. ISE '27  •  FULL-STACK &amp; AI
  </text>

  <!-- Main Name Lockup -->
  <text x="72" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="#F8F0F3">
    MOHAMMED ROSHAN
  </text>
  <text x="72" y="206" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="#E5B5C7">
    SHARIEFF
  </text>

  <!-- Animated Gradient Bar -->
  <rect x="72" y="228" width="340" height="4" rx="2" fill="url(#accentGrad)">
    <animate attributeName="width" values="140;360;140" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Role & Focus -->
  <text x="74" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4.5" fill="#F8F0F3">
    FULL-STACK DEVELOPER
  </text>
  <text x="74" y="308" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.4" fill="#C77B9B">
    AI / ML  •  COMPUTER VISION  •  SOFTWARE &amp; HARDWARE
  </text>

  <!-- Terminal Prompt Footer Line -->
  <text x="74" y="346" font-family="Consolas, 'Fira Code', monospace" font-size="12" fill="#E5B5C7" fill-opacity="0.72">
    ~/roshanshariff422  $  turning ideas into code
  </text>

  <!-- Right Orbital Tech Emblem -->
  <g transform="translate(965, 190)">
    <circle r="154" fill="none" stroke="#E5B5C7" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="6 12">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle r="118" fill="none" stroke="#C77B9B" stroke-opacity="0.34" stroke-width="1.5"/>
      <circle cx="0" cy="-118" r="5.5" fill="#E5B5C7">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="102" cy="59" r="4" fill="#C77B9B"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
    </g>

    <circle r="80" fill="#190B12" fill-opacity="0.92" stroke="#701A3D" stroke-width="1.8"/>
    <circle r="68" fill="none" stroke="#C77B9B" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 5"/>

    <!-- Vector Code Emblem </> -->
    <path d="M-24 -12 L-38 0 L-24 12" fill="none" stroke="#E5B5C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 -12 L38 0 L24 12" fill="none" stroke="#E5B5C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 -18 L-8 18" fill="none" stroke="#C77B9B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Micro Neural Dots -->
    <circle cx="0" cy="-42" r="3" fill="#F8F0F3" fill-opacity="0.8"/>
    <circle cx="0" cy="42" r="3" fill="#F8F0F3" fill-opacity="0.8"/>
    <circle cx="-42" cy="0" r="3" fill="#C77B9B" fill-opacity="0.8"/>
    <circle cx="42" cy="0" r="3" fill="#C77B9B" fill-opacity="0.8"/>
  </g>
</svg>
