<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" role="img" aria-label="AI-Based Smart Waste Segregation - Intelligent waste sorting via computer vision &amp; hardware.">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
  </defs>

  <rect width="580" height="310" rx="18" fill="url(#projBg)" stroke="#451126" stroke-width="1.5"/>

  <!-- Header Row -->
  <rect x="28" y="22" width="108" height="24" rx="12" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="82" y="38" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#E5B5C7">PROJECT 01</text>

  <rect x="423" y="22" width="129" height="24" rx="12" fill="#10070C" stroke="#C77B9B" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="437" cy="34" r="3.8" fill="#E5B5C7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <text x="448" y="38" font-family="Consolas, 'Fira Code', monospace" font-size="10.8" font-weight="700" letter-spacing="0.8" fill="#F8F0F3">IN DEVELOPMENT</text>

  <!-- Title & Summary -->
  <text x="28" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#F8F0F3">AI-Based Smart Waste Segregation</text>
  <text x="28" y="103" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#C77B9B">Intelligent waste sorting via computer vision &amp; hardware.</text>

  <!-- Spec Panel -->
  <rect x="28" y="120" width="524" height="118" rx="12" fill="#10070C" stroke="#451126" stroke-width="1.1"/>
