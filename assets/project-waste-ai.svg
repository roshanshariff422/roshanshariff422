  <text x="62" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#F8F0F3" fill-opacity="0.94">Python–Arduino serial communication bridge</text>
  <circle cx="48" cy="215.5" r="2.8" fill="#E5B5C7"/>
  <text x="62" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#F8F0F3" fill-opacity="0.94">Automated sorting using motors &amp; sensors</text>

