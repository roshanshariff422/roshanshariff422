  <rect x="100" y="256" width="64" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="132.0" y="274" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#E5B5C7">OpenCV</text>
  <rect x="172" y="256" width="92" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="218.0" y="274" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#E5B5C7">TensorFlow</text>
  <rect x="272" y="256" width="43" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="293.5" y="274" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#E5B5C7">CNN</text>
  <rect x="323" y="256" width="71" height="28" rx="14" fill="#451126" stroke="#701A3D" stroke-width="1"/>
  <text x="358.5" y="274" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#E5B5C7">Arduino</text>

