  <text x="54" y="35.5" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="13" font-weight="700" fill="#E5B5C7">02</text>

  <!-- Title -->
  <text x="90" y="36.5" font-family="'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="700" letter-spacing="2.8" fill="#F8F0F3">TECH STACK &amp; TOOLKIT</text>

  <!-- Subtitle -->
  <text x="1174" y="35.5" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.6" fill="#C77B9B">Languages, frameworks &amp; hardware</text>

  <!-- Subtle Bottom Shimmer -->
