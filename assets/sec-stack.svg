  <rect width="1200" height="62" rx="14" fill="url(#hdrBg)" stroke="#451126" stroke-width="1.3"/>
  <rect x="16" y="15" width="4" height="32" rx="2" fill="#E5B5C7"/>

  <!-- Number Pill -->
