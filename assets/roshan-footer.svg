<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 150">

<defs>

<linearGradient id="line">
  <stop offset="0%" stop-color="#451126"/>
  <stop offset="50%" stop-color="#E5B5C7"/>
  <stop offset="100%" stop-color="#451126"/>
</linearGradient>

</defs>

<rect width="1200" height="150"
      rx="20" fill="#10070C"/>

<path d="M60 35H1140"
      stroke="url(#line)"
      stroke-width="2">

  <animate attributeName="stroke-opacity"
           values=".2;1;.2"
           dur="3s"
           repeatCount="indefinite"/>

</path>

<text x="600" y="85"
      font-family="Georgia,serif"
      font-size="30"
      text-anchor="middle"
      letter-spacing="5"
      fill="#F8F0F3">

CREATE • INNOVATE • BUILD

</text>

<text x="600" y="115"
      font-family="Arial,sans-serif"
      font-size="12"
      text-anchor="middle"
      letter-spacing="4"
      fill="#C77B9B">

MOHAMMED ROSHAN SHARIEFF

</text>

</svg>
